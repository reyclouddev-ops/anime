<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKu - Premium Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07090f; color: #f3f4f6; }
        .glass-card { background: rgba(18, 24, 38, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #07090f; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen pb-24 selection:bg-amber-500 selection:text-slate-950">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-[#07090f]/90 backdrop-blur-md border-b border-slate-800/50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="font-black text-xl tracking-wider text-amber-500 cursor-pointer flex items-center gap-2" onclick="loadHome()">
                <span>⚡</span> ANIME<span class="text-white">KU</span>
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="showToast('Tidak ada notifikasi baru', 'success')" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 p-2.5 rounded-full relative transition">
                    🔔 <span class="absolute top-1 right-1 bg-rose-600 text-white text-[9px] px-1 rounded-full font-bold">99+</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container Content -->
    <main class="max-w-4xl mx-auto px-4 py-5 animate-fade" id="mainContent">
        <!-- Loader -->
        <div id="loader" class="text-center py-32">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-amber-500 border-t-transparent shadow-lg shadow-amber-500/20"></div>
            <p class="mt-3 text-slate-400 text-xs tracking-wider uppercase font-semibold">Memuat Konten Anime...</p>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#0c101d]/95 backdrop-blur-xl border-t border-slate-800/80 py-3 px-6 max-w-4xl mx-auto rounded-t-3xl shadow-2xl">
        <div class="flex justify-around items-center">
            <button onclick="loadHome()" class="flex flex-col items-center gap-1 text-amber-400 transition hover:scale-110">
                <span class="text-xl">🏠</span>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            <button onclick="showToast('Fitur Jadwal segera hadir!', 'success')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition hover:scale-110">
                <span class="text-xl">📅</span>
                <span class="text-[10px] font-semibold">Jadwal</span>
            </button>
            <button onclick="showToast('Riwayat tontonan kosong', 'success')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition hover:scale-110">
                <span class="text-xl">⏱️</span>
                <span class="text-[10px] font-semibold">Riwayat</span>
            </button>
        </div>
    </nav>

    <script>
        const API = "";

        function showToast(message, type = 'error') {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            const bgClass = type === 'success' 
                ? 'bg-slate-900/95 border-amber-500/40 text-amber-300' 
                : 'bg-slate-900/95 border-rose-500/40 text-rose-300';
            
            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl animate-fade text-xs font-bold ${bgClass}`;
            toast.innerHTML = `<span>${type === 'success' ? '⚡' : '⚠️'}</span> <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function loadHome() {
            setLoading(true);
            try {
                const res = await fetch(`${API}/api/home`);
                const json = await res.json();
                if (json.success) renderHome(json.data);
            } catch (err) {
                showToast("Gagal menyambungkan ke server.");
            }
            setLoading(false);
        }

        function setLoading(isLoading) {
            document.getElementById("loader").style.display = isLoading ? "block" : "none";
            if(isLoading) {
                document.getElementById("mainContent").innerHTML = `
                    <div class="text-center py-32">
                        <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-amber-500 border-t-transparent shadow-lg shadow-amber-500/20"></div>
                        <p class="mt-3 text-slate-400 text-xs tracking-wider uppercase font-semibold">Memuat Konten Anime...</p>
                    </div>`;
            }
        }

        function renderHome(data) {
            let html = `
                <!-- Search Bar Aesthetic -->
                <div class="relative mb-6">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">🔍</span>
                    <input type="text" id="searchInput" placeholder="Cari Anime Di Sini..." class="w-full bg-[#121826] text-slate-200 pl-11 pr-4 py-3 rounded-2xl text-sm border border-slate-800/80 focus:outline-none focus:border-amber-500 transition shadow-inner placeholder:text-slate-500 font-medium" onkeypress="if(event.key === 'Enter') handleSearch()">
                </div>

                <!-- Trending Showcase Banner -->
                ${data.trending && data.trending.length > 0 ? `
                    <div class="relative rounded-2xl overflow-hidden aspect-[21/9] mb-7 shadow-2xl border border-slate-800 cursor-pointer group" onclick="loadDetail('${data.trending[0].url}')">
                        <img src="${data.trending[0].image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" alt="Trending">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#07090f] via-slate-950/40 to-transparent"></div>
                        <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
                            <div>
                                <span class="bg-amber-500 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded-md uppercase tracking-wider mb-1.5 inline-block shadow">#1 Trending</span>
                                <h3 class="font-extrabold text-base md:text-lg text-white line-clamp-1">${data.trending[0].title}</h3>
                            </div>
                            <span class="bg-slate-900/80 backdrop-blur-md text-slate-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-slate-700">🔥 Hot</span>
                        </div>
                    </div>
                ` : ''}

                <!-- Rilis Terbaru / Episodes Section -->
                <section class="mb-8">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-extrabold text-sm text-slate-100 flex items-center gap-2">
                            <span class="w-1.5 h-4 bg-amber-500 rounded-full"></span> Terakhir Ditonton / Update
                        </h3>
                        <span class="text-xs text-amber-400 font-bold cursor-pointer hover:underline" onclick="showToast('Menampilkan semua update', 'success')">Lihat Lainnya ></span>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        ${data.latestEpisodes.slice(0, 6).map(ep => `
                            <div class="group bg-[#121826] border border-slate-800/80 rounded-xl overflow-hidden shadow-md hover:border-amber-500/50 transition cursor-pointer flex flex-col" onclick="loadWatch('${ep.url}')">
                                <div class="relative aspect-video bg-slate-950 overflow-hidden">
                                    <img src="${ep.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                    <div class="absolute bottom-1 left-1 bg-slate-950/80 text-amber-400 text-[9px] font-extrabold px-1.5 py-0.5 rounded backdrop-blur-sm">
                                        ${ep.episode || 'Eps 1'}
                                    </div>
                                </div>
                                <div class="p-2.5">
                                    <h4 class="font-bold text-xs text-slate-200 line-clamp-1 group-hover:text-amber-400 transition">${ep.title}</h4>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>

                <!-- New Update Anime Grid (Trending List) -->
                <section class="mb-8">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-extrabold text-sm text-slate-100 flex items-center gap-2">
                            <span class="w-1.5 h-4 bg-rose-500 rounded-full"></span> New Update Anime
                        </h3>
                        <span class="text-xs text-rose-400 font-bold cursor-pointer hover:underline" onclick="showToast('Jadwal rilis lengkap', 'success')">Lihat Jadwal ></span>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        ${data.trending.map(item => `
                            <div class="group bg-[#121826] border border-slate-800/80 rounded-xl overflow-hidden shadow-md hover:border-rose-500/50 transition cursor-pointer flex flex-col" onclick="loadDetail('${item.url}')">
                                <div class="relative aspect-[3/4] bg-slate-950 overflow-hidden">
                                    <img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                    <span class="absolute top-1.5 left-1.5 bg-rose-600 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded shadow">New</span>
                                    <span class="absolute top-1.5 right-1.5 bg-slate-950/80 text-amber-400 text-[9px] font-extrabold px-1.5 py-0.5 rounded backdrop-blur-sm">⭐ 8.2</span>
                                </div>
                                <div class="p-2.5">
                                    <h4 class="font-bold text-xs text-slate-200 line-clamp-1 group-hover:text-rose-400 transition">${item.title}</h4>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;
            document.getElementById("mainContent").innerHTML = html;
        }

        async function handleSearch() {
            const query = document.getElementById("searchInput").value.trim();
            if(!query) {
                showToast("Masukkan judul anime yang ingin dicari!");
                return;
            }
            setLoading(true);
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const json = await res.json();
                let html = `
                    <button onclick="loadHome()" class="mb-5 bg-[#121826] hover:bg-slate-800 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold transition text-slate-300">&larr; Kembali</button>
                    <h2 class="font-extrabold text-base mb-4 text-white">Hasil Pencarian: <span class="text-amber-400">"${query}"</span></h2>
                    <div class="grid grid-cols-3 gap-3">
                `;
                
                if(!json.data || json.data.length === 0) {
                    html += `<p class="text-slate-400 col-span-full py-12 text-center text-xs">Anime tidak ditemukan.</p>`;
                } else {
                    html += json.data.map(item => `
                        <div class="group bg-[#121826] border border-slate-800/80 rounded-xl overflow-hidden shadow-md hover:border-amber-500/50 transition cursor-pointer flex flex-col" onclick="loadDetail('${item.url}')">
                            <div class="relative aspect-[3/4] bg-slate-950 overflow-hidden">
                                <img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            </div>
                            <div class="p-2.5">
                                <h4 class="font-bold text-xs text-slate-200 line-clamp-1 group-hover:text-amber-400 transition">${item.title}</h4>
                            </div>
                        </div>
                    `).join('');
                }
                html += `</div>`;
                document.getElementById("mainContent").innerHTML = html;
            } catch (err) {
                showToast("Pencarian gagal.");
                loadHome();
            }
        }

        async function loadDetail(url) {
            setLoading(true);
            try {
                const encodedUrl = encodeURIComponent(url);
                const res = await fetch(`/api/detail?url=${encodedUrl}`);
                const json = await res.json();
                
                if (!json.success || !json.data) {
                    throw new Error(json.message || "Gagal memuat detail");
                }
                
                const d = json.data;

                let html = `
                    <button onclick="loadHome()" class="mb-5 bg-[#121826] hover:bg-slate-800 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold transition text-slate-300">&larr; Kembali</button>
                    
                    <div class="relative rounded-2xl overflow-hidden aspect-[16/9] mb-5 border border-slate-800 shadow-xl">
                        <img src="${d.poster || 'https://i.imgur.com/3962b9B.jpeg'}" class="w-full h-full object-cover filter blur-sm opacity-50 scale-105">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#07090f] via-slate-950/70 to-transparent"></div>
                        <div class="absolute bottom-4 left-4 right-4 flex items-end gap-4">
                            <img src="${d.poster || 'https://i.imgur.com/3962b9B.jpeg'}" class="w-24 h-36 object-cover rounded-xl shadow-2xl border-2 border-slate-700 flex-shrink-0">
                            <div>
                                <h2 class="font-extrabold text-lg md:text-xl text-white leading-tight mb-1">${d.title || 'Tanpa Judul'}</h2>
                                <p class="text-xs text-amber-400 font-semibold mb-2">${d.japaneseTitle || 'Update Terbaru'}</p>
                                <div class="flex flex-wrap gap-1">
                                    ${d.genres && d.genres.length > 0 ? d.genres.slice(0, 3).map(g => `<span class="bg-slate-800/80 text-slate-300 text-[10px] font-bold px-2.5 py-0.5 rounded-md border border-slate-700">${g}</span>`).join('') : ''}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-3 mb-6">
                        <button onclick="${d.episodes && d.episodes.length > 0 ? `loadWatch('${d.episodes[0].url}')` : `showToast('Episode belum ada')`}" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 transition">
                            ▶ Lanjut Episode
                        </button>
                        <button onclick="showToast('Berhasil berlangganan anime ini!', 'success')" class="bg-[#121826] hover:bg-slate-800 text-slate-200 font-bold py-3 px-5 rounded-2xl text-xs border border-slate-800 transition">
                            🔔 Subscribe
                        </button>
                    </div>

                    <div class="bg-[#121826] border border-slate-800/80 p-4 rounded-2xl mb-6 shadow-inner">
                        <h3 class="font-extrabold text-xs text-slate-300 uppercase tracking-wider mb-2">Synopsis</h3>
                        <p class="text-xs text-slate-400 leading-relaxed">${d.description || 'Tidak ada sinopsis ringkas.'}</p>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-extrabold text-sm text-white flex items-center gap-2">
                                <span class="w-1.5 h-4 bg-amber-500 rounded-full"></span> Episodes (${d.episodes ? d.episodes.length : 0})
                            </h3>
                            <span class="text-[10px] bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg font-bold border border-slate-700">Grid View</span>
                        </div>
                        <div class="grid grid-cols-5 sm:grid-cols-8 gap-2 max-h-[350px] overflow-y-auto custom-scrollbar p-1">
                            ${d.episodes && d.episodes.length > 0 ? d.episodes.map((ep, idx) => `
                                <button onclick="loadWatch('${ep.url}')" class="bg-[#121826] hover:bg-amber-500 hover:text-slate-950 border border-slate-800/90 py-2.5 rounded-xl text-xs font-extrabold transition text-center shadow text-slate-300 flex flex-col items-center justify-center" title="${ep.title || 'Episode'}">
                                    <span>${idx + 1}</span>
                                    <span class="text-[8px] opacity-60 font-medium">Eps</span>
                                </button>
                            `).join('') : '<p class="text-slate-400 col-span-full text-xs py-4 text-center">Belum ada episode.</p>'}
                        </div>
                    </div>
                `;
                document.getElementById("mainContent").innerHTML = html;
            } catch (err) {
                showToast("Gagal memuat detail anime.");
                loadHome();
            }
        }

        async function loadWatch(url) {
            setLoading(true);
            try {
                const encodedUrl = encodeURIComponent(url);
                const res = await fetch(`/api/watch?url=${encodedUrl}`);
                const json = await res.json();
                const w = json.data;

                let html = `
                    <button onclick="window.history.back()" class="mb-4 bg-[#121826] hover:bg-slate-800 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold transition text-slate-300">&larr; Kembali</button>
                    
                    <div class="bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 aspect-video flex items-center justify-center relative mb-4">
                        ${w.videoUrl ? `<video controls autoplay class="w-full h-full object-contain"><source src="${w.videoUrl}" type="video/mp4">Browser tidak mendukung video.</video>` : `<div class="text-center p-6"><p class="text-rose-500 text-xs font-bold mb-1">Link video langsung belum tersedia.</p></div>`}
                    </div>

                    <h2 class="font-extrabold text-sm text-white mb-2">${w.title}</h2>
                    <div class="flex gap-2 mb-6">
                        <button onclick="showToast('Kualitas video: 1080p (HD)', 'success')" class="bg-[#121826] border border-slate-800 px-3 py-1.5 rounded-xl text-[10px] font-bold text-amber-400">⚙️ 1080p Quality</button>
                        <button onclick="showToast('Video berhasil diunduh', 'success')" class="bg-[#121826] border border-slate-800 px-3 py-1.5 rounded-xl text-[10px] font-bold text-slate-300">📥 Download</button>
                    </div>
                `;
                document.getElementById("mainContent").innerHTML = html;
            } catch (err) {
                showToast("Gagal memuat video player.");
                loadHome();
            }
        }

        loadHome();
    </script>
</body>
</html>
